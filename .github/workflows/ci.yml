name: CI

on:
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # ── Lint + UI build/test ─────────────────────────────────────────────────────
  lint-ui:
    name: Lint + UI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install UI dependencies
        run: npm ci --prefix ui

      - name: Build UI
        run: npm run build --prefix ui

      - name: Test UI
        run: npm test --prefix ui

      - name: Smoke-test UI bundle
        run: npm run test:smoke --prefix ui

      - name: Lint shell scripts
        run: find scripts -name "*.sh" | sort | xargs shellcheck --severity=error

  # ── Select tests ─────────────────────────────────────────────────────────────
  select-tests:
    name: Select tests
    runs-on: ubuntu-latest
    outputs:
      unit_tests: ${{ steps.select.outputs.unit_tests }}
      integration_tests: ${{ steps.select.outputs.integration_tests }}
      run_all: ${{ steps.select.outputs.run_all }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute test selection
        id: select
        run: |
          chmod +x scripts/select-tests.sh

          unit=$(scripts/select-tests.sh --unit-only 2>/dev/null || echo "ALL")
          intg=$(scripts/select-tests.sh --integration-only 2>/dev/null || echo "ALL")

          if [ "$unit" = "ALL" ] || [ "$intg" = "ALL" ]; then
            echo "run_all=true" >> "$GITHUB_OUTPUT"
            echo "unit_tests=" >> "$GITHUB_OUTPUT"
            echo "integration_tests=" >> "$GITHUB_OUTPUT"
          else
            echo "run_all=false" >> "$GITHUB_OUTPUT"
            # Space-separated for bats; empty string means skip the job
            echo "unit_tests=$(echo "$unit" | tr '\n' ' ' | sed 's/ $//')" >> "$GITHUB_OUTPUT"
            echo "integration_tests=$(echo "$intg" | tr '\n' ' ' | sed 's/ $//')" >> "$GITHUB_OUTPUT"
          fi

  # ── Unit tests (parallel bats workers) ──────────────────────────────────────
  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    needs: select-tests
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install bats
        run: npm install -g bats

      - name: Run unit tests (selected)
        if: needs.select-tests.outputs.run_all == 'true' || needs.select-tests.outputs.unit_tests != ''
        run: |
          if [ "${{ needs.select-tests.outputs.run_all }}" = "true" ]; then
            bats --jobs 4 test/unit/
          else
            bats --jobs 4 ${{ needs.select-tests.outputs.unit_tests }}
          fi

      - name: Skip (no unit tests in scope)
        if: needs.select-tests.outputs.run_all == 'false' && needs.select-tests.outputs.unit_tests == ''
        run: echo "No unit tests map to the changed files — skipping."

      - name: Update flaky ledger
        if: always()
        env:
          GH_SHA: ${{ github.sha }}
          GH_RUN_ID: ${{ github.run_id }}
          JOB_STATUS: ${{ job.status }}
          TEST_ID: ${{ github.job }}
        run: |
          if [ "$JOB_STATUS" = "failure" ]; then
            python3 .ci-guard/scripts/flaky_ledger.py record-failure \
              --test "$TEST_ID" --sha "$GH_SHA" --run-id "$GH_RUN_ID" || true
          else
            python3 .ci-guard/scripts/flaky_ledger.py record-pass \
              --test "$TEST_ID" --sha "$GH_SHA" --run-id "$GH_RUN_ID" || true
          fi

  # ── Integration tests ────────────────────────────────────────────────────────
  integration:
    name: Integration tests
    runs-on: ubuntu-latest
    needs: select-tests
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Configure git identity
        run: |
          git config --global user.email "ci@monozukuri.local"
          git config --global user.name "CI"

      - name: Install bats
        run: npm install -g bats

      - name: Run integration tests (selected)
        if: needs.select-tests.outputs.run_all == 'true' || needs.select-tests.outputs.integration_tests != ''
        run: |
          if [ "${{ needs.select-tests.outputs.run_all }}" = "true" ]; then
            bats test/integration/
          else
            bats ${{ needs.select-tests.outputs.integration_tests }}
          fi

      - name: Skip (no integration tests in scope)
        if: needs.select-tests.outputs.run_all == 'false' && needs.select-tests.outputs.integration_tests == ''
        run: echo "No integration tests map to the changed files — skipping."

      - name: Update flaky ledger
        if: always()
        env:
          GH_SHA: ${{ github.sha }}
          GH_RUN_ID: ${{ github.run_id }}
          JOB_STATUS: ${{ job.status }}
          TEST_ID: ${{ github.job }}
        run: |
          if [ "$JOB_STATUS" = "failure" ]; then
            python3 .ci-guard/scripts/flaky_ledger.py record-failure \
              --test "$TEST_ID" --sha "$GH_SHA" --run-id "$GH_RUN_ID" || true
          else
            python3 .ci-guard/scripts/flaky_ledger.py record-pass \
              --test "$TEST_ID" --sha "$GH_SHA" --run-id "$GH_RUN_ID" || true
          fi

  # ── Conformance tests (always run — structural, fast, no source dependency) ──
  conformance:
    name: Conformance tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install bats
        run: npm install -g bats

      - name: Run conformance tests
        run: bats test/conformance/

      - name: Update flaky ledger
        if: always()
        env:
          GH_SHA: ${{ github.sha }}
          GH_RUN_ID: ${{ github.run_id }}
          JOB_STATUS: ${{ job.status }}
          TEST_ID: ${{ github.job }}
        run: |
          if [ "$JOB_STATUS" = "failure" ]; then
            python3 .ci-guard/scripts/flaky_ledger.py record-failure \
              --test "$TEST_ID" --sha "$GH_SHA" --run-id "$GH_RUN_ID" || true
          else
            python3 .ci-guard/scripts/flaky_ledger.py record-pass \
              --test "$TEST_ID" --sha "$GH_SHA" --run-id "$GH_RUN_ID" || true
          fi

  # ── ci-guard: classify failures, enforce retry budgets ───────────────────────
  # Runs whenever any upstream job fails. Classifies each failure via ci_watch.py
  # and exits non-zero on branch_failure or budget exhaustion so the PR cannot
  # merge without a human triage decision.
  classify-failures:
    name: ci-guard / classify failures
    runs-on: ubuntu-latest
    needs: [lint-ui, unit, integration, conformance]
    if: failure()
    permissions:
      checks: read
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Classify CI failures
        run: |
          python3 .ci-guard/scripts/ci_watch.py --pr auto --once
        # Exit codes from ci_watch.py:
        #   0 — all checks green or only flakes (retryable within budget)
        #   2 — branch_failure detected or needs_help (blocks merge)
        #   3 — retry budget exhausted (blocks merge)

  # ── Quarantine guard ─────────────────────────────────────────────────────────
  quarantine-guard:
    name: Quarantine guard
    runs-on: ubuntu-latest
    needs: [lint-ui, unit, integration, conformance]
    if: always()
    steps:
      - uses: actions/checkout@v4

      - name: Warn on quarantine candidates
        run: |
          candidates=$(python3 .ci-guard/scripts/flaky_ledger.py quarantine-candidates)
          if [ -n "$(echo "$candidates" | jq -r '.[]' 2>/dev/null)" ]; then
            echo "::warning::Quarantine candidates exist; review before merging."
            echo "$candidates"
          fi
