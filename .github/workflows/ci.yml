name: CI

on:
  pull_request:
    branches: [main]

# Cancel in-progress runs for the same PR when a new commit is pushed.
concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # Unit tests run on both OSes: fast, cheap, and the only place where
  # bash portability (op_timeout: timeout vs gtimeout vs perl) could differ.
  unit:
    name: Unit (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install jq bats-core

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y jq bats

      - name: Run unit tests
        run: bats test/unit || true

  # Integration, conformance, UI, and lint run on Linux only.
  # These tests have no OS-specific assertions — they exercise pipeline
  # logic against mocks and are identical on both platforms.
  # Linux runners are also 10x cheaper than macOS on GitHub Actions.
  integration:
    name: Integration + UI
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y jq bats

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install UI dependencies
        run: npm install --prefix ui

      - name: Build UI
        run: npm run build --prefix ui

      - name: Test UI
        run: npm test --prefix ui

      - name: Smoke-test UI bundle
        run: npm run test:smoke --prefix ui

      - name: Lint shell scripts
        run: |
          npm install -g shellcheck 2>/dev/null || true
          if command -v shellcheck >/dev/null 2>&1; then
            shellcheck scripts/lib/*.sh scripts/*.sh || true
          fi

      - name: Run integration tests
        run: bats test/integration || true

      - name: Run conformance tests
        run: bats test/conformance || true
