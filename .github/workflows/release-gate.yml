name: Release Gate

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

# Cancel stale gate runs when release PR is force-pushed or rebased.
concurrency:
  group: release-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  release-gate:
    name: Release gate
    runs-on: ubuntu-latest
    steps:
      - name: Check if release PR
        id: check
        run: |
          branch="${{ github.head_ref }}"
          if [[ "$branch" == release-please* ]]; then
            echo "is_release=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_release=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.check.outputs.is_release == 'true'

      - name: Extract version from PR title
        if: steps.check.outputs.is_release == 'true'
        id: version
        run: |
          title="${{ github.event.pull_request.title }}"
          version=$(echo "$title" | grep -oE '[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?' | head -1)
          if [ -z "$version" ]; then
            echo "Could not extract version from PR title: $title" >&2
            exit 1
          fi
          is_prerelease=$([[ "$version" == *-rc.* ]] && echo true || echo false)
          echo "version=v$version" >> "$GITHUB_OUTPUT"
          echo "is_prerelease=$is_prerelease" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        if: steps.check.outputs.is_release == 'true'
        with:
          node-version: "22"

      - name: Install bats
        if: steps.check.outputs.is_release == 'true'
        run: npm install -g bats

      - name: Run release gate
        if: steps.check.outputs.is_release == 'true'
        env:
          MONOZUKURI_SKIP_LIVE_CANARY: "1"
          MONOZUKURI_SKIP_SCALE_SOAK_LIVE: "1"
          # Layer 7 makes live `claude --print` calls. Keep it off in CI to
          # honour the zero-CI-cost discipline; maintainers run it locally
          # pre-release via `make conformance` or an unset env var.
          MONOZUKURI_SKIP_CONFORMANCE: "1"
        run: .qa/release-gate.sh "${{ steps.version.outputs.version }}"

      - name: Skip (not a release PR)
        if: steps.check.outputs.is_release != 'true'
        run: echo "Not a release PR — gate skipped."
