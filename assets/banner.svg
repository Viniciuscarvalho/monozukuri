<svg width="100%" viewBox="0 0 1290 330" role="img" xmlns="http://www.w3.org/2000/svg" style="">
<title style="fill:rgb(0, 0, 0);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, &quot;system-ui&quot;, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto">Monozukuri — autonomous feature delivery for Claude Code</title>
<desc style="fill:rgb(0, 0, 0);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, &quot;system-ui&quot;, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto">Header image for the Monozukuri GitHub repository README. Shows the wordmark, kanji, tagline, and a stylized pipeline trail.</desc>

<rect width="1280" height="320" fill="#0E0E10" style="fill:rgb(14, 14, 16);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, &quot;system-ui&quot;, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>

<!-- subtle vertical gradient overlay for depth -->
<defs>
<linearGradient id="depth" x1="0" y1="0" x2="0" y2="1">
<stop offset="0%" stop-color="#1A1A1D" stop-opacity="0.5"/>
<stop offset="100%" stop-color="#0E0E10" stop-opacity="0"/>
</linearGradient>
<linearGradient id="trail" x1="0" y1="0" x2="1" y2="0">
<stop offset="0%" stop-color="#E0794A" stop-opacity="0"/>
<stop offset="20%" stop-color="#E0794A" stop-opacity="0.7"/>
<stop offset="100%" stop-color="#E0794A" stop-opacity="0"/>
</linearGradient>
</defs>
<rect width="1280" height="320" fill="url(#depth)" style="stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, &quot;system-ui&quot;, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>

<!-- accent bar + eyebrow -->
<line x1="80" y1="68" x2="124" y2="68" stroke="#E0794A" stroke-width="2" style="fill:rgb(0, 0, 0);stroke:rgb(224, 121, 74);color:rgb(255, 255, 255);stroke-width:2px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, &quot;system-ui&quot;, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
<text x="80" y="92" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#8B8B85" letter-spacing="3" style="fill:rgb(139, 139, 133);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:-apple-system, &quot;system-ui&quot;, &quot;Segoe UI&quot;, Roboto, sans-serif;font-size:13px;font-weight:400;text-anchor:start;dominant-baseline:auto">AUTONOMOUS FEATURE DELIVERY FOR CLAUDE CODE</text>

<!-- wordmark -->
<text x="80" y="180" font-family="Georgia, 'Times New Roman', serif" font-size="84" font-weight="500" fill="#F5F5F2" style="fill:rgb(245, 245, 242);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:Georgia, &quot;Times New Roman&quot;, serif;font-size:84px;font-weight:500;text-anchor:start;dominant-baseline:auto">Monozukuri</text>

<!-- kanji -->
<text x="80" y="215" font-family="Georgia, 'Times New Roman', serif" font-size="24" fill="#E0794A" style="fill:rgb(224, 121, 74);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:Georgia, &quot;Times New Roman&quot;, serif;font-size:24px;font-weight:400;text-anchor:start;dominant-baseline:auto">ものづくり</text>

<!-- tagline -->
<text x="80" y="262" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="500" fill="#F5F5F2" style="fill:rgb(245, 245, 242);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:-apple-system, &quot;system-ui&quot;, &quot;Segoe UI&quot;, Roboto, sans-serif;font-size:22px;font-weight:500;text-anchor:start;dominant-baseline:auto">Reads your backlog. Opens the PRs. While you're away.</text>

<!-- pipeline trail anchored to the right -->
<g transform="translate(780, 130)" style="fill:rgb(0, 0, 0);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, &quot;system-ui&quot;, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto">
