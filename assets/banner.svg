<text x="160" y="-18" font-family="-apple-system, sans-serif" font-size="10" fill="#A5A5A0" text-anchor="middle" style="fill:rgb(165, 165, 160);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:-apple-system, sans-serif;font-size:10px;font-weight:400;text-anchor:middle;dominant-baseline:auto">Tasks</text>
