<svg width="100%" viewBox="0 0 680 280" role="img" xmlns="http://www.w3.org/2000/svg">
<title>The six-phase pipeline</title>
<desc>Six sequential phases each producing a named artifact, bracketed by a size gate at the start and a cycle gate at the end.</desc>
<style>
.t { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 14px; font-weight: 400; }
.ts { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 12px; fill: #6b6b6b; font-weight: 400; }
.th { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 14px; font-weight: 500; }
@media (prefers-color-scheme: dark) { .ts { fill: #a5a5a0; } }
</style>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<text x="40" y="30" class="th" fill="#1f1f1f">The six-phase pipeline</text>
<text x="40" y="50" class="ts">Each phase produces a named artifact. The gates bracket the cycle.</text>

<rect x="40" y="100" width="60" height="60" rx="8" fill="#FAEEDA" stroke="#BA7517" stroke-width="0.5"/>
<text x="70" y="125" class="th" text-anchor="middle" fill="#633806">Size</text>
<text x="70" y="143" class="ts" text-anchor="middle" fill="#854F0B">gate</text>

<line x1="100" y1="130" x2="125" y2="130" stroke="#888780" stroke-width="0.5" marker-end="url(#arrow)"/>

<rect x="125" y="100" width="70" height="60" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="160" y="125" class="th" text-anchor="middle" fill="#3C3489">PRD</text>
<text x="160" y="178" class="ts" text-anchor="middle">prd.md</text>

<line x1="195" y1="130" x2="220" y2="130" stroke="#888780" stroke-width="0.5" marker-end="url(#arrow)"/>

<rect x="220" y="100" width="70" height="60" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="255" y="125" class="th" text-anchor="middle" fill="#3C3489">Tech</text>
<text x="255" y="143" class="th" text-anchor="middle" fill="#3C3489">Spec</text>
<text x="255" y="178" class="ts" text-anchor="middle">spec.md</text>

<line x1="290" y1="130" x2="315" y2="130" stroke="#888780" stroke-width="0.5" marker-end="url(#arrow)"/>

<rect x="315" y="100" width="70" height="60" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="350" y="125" class="th" text-anchor="middle" fill="#3C3489">Tasks</text>
<text x="350" y="178" class="ts" text-anchor="middle">tasks.md</text>

<line x1="385" y1="130" x2="410" y2="130" stroke="#888780" stroke-width="0.5" marker-end="url(#arrow)"/>

<rect x="410" y="100" width="70" height="60" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="445" y="125" class="th" text-anchor="middle" fill="#085041">Code</text>
<text x="445" y="178" class="ts" text-anchor="middle">diff</text>

<line x1="480" y1="130" x2="505" y2="130" stroke="#888780" stroke-width="0.5" marker-end="url(#arrow)"/>

<rect x="505" y="100" width="70" height="60" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="540" y="125" class="th" text-anchor="middle" fill="#085041">Tests</text>
<text x="540" y="178" class="ts" text-anchor="middle">test files</text>

<line x1="575" y1="130" x2="600" y2="130" stroke="#888780" stroke-width="0.5" marker-end="url(#arrow)"/>

<rect x="600" y="100" width="40" height="60" rx="8" fill="#FAEEDA" stroke="#BA7517" stroke-width="0.5"/>
<text x="620" y="125" class="th" text-anchor="middle" fill="#633806">PR</text>
<text x="620" y="143" class="ts" text-anchor="middle" fill="#854F0B">+gate</text>

<text x="270" y="240" class="ts" text-anchor="middle">Plan phases (Opus)</text>
<line x1="155" y1="220" x2="385" y2="220" stroke="#999" stroke-width="0.5" stroke-dasharray="2,3"/>
<text x="491" y="240" class="ts" text-anchor="middle">Execute phases (Sonnet)</text>
<line x1="410" y1="220" x2="575" y2="220" stroke="#999" stroke-width="0.5" stroke-dasharray="2,3"/>
</svg>
