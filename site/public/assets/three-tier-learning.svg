<svg width="100%" viewBox="0 0 680 300" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Three-tier learning store</title>
<desc>Per-feature outcomes aggregate to per-project patterns and per-user global patterns; each tier primes the next run.</desc>
<style>
.ts { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 12px; fill: #6b6b6b; font-weight: 400; }
.th { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 14px; font-weight: 500; }
@media (prefers-color-scheme: dark) { .ts { fill: #a5a5a0; } }
</style>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<text x="40" y="30" class="th" fill="#1f1f1f">Three-tier learning store</text>
<text x="40" y="50" class="ts">Outcomes aggregate upward. Patterns prime downward.</text>

<rect x="40" y="90" width="180" height="60" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="130" y="115" class="th" text-anchor="middle" fill="#085041">Feature tier</text>
<text x="130" y="135" class="ts" text-anchor="middle" fill="#0F6E56">.monozukuri/learnings/feature/</text>

<rect x="250" y="90" width="180" height="60" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="340" y="115" class="th" text-anchor="middle" fill="#085041">Project tier</text>
<text x="340" y="135" class="ts" text-anchor="middle" fill="#0F6E56">.monozukuri/learnings/project/</text>

<rect x="460" y="90" width="180" height="60" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="550" y="115" class="th" text-anchor="middle" fill="#085041">Global tier</text>
<text x="550" y="135" class="ts" text-anchor="middle" fill="#0F6E56">~/.monozukuri/learnings/</text>

<path d="M220 110 L 250 110" fill="none" stroke="#888780" stroke-width="0.5" marker-end="url(#arrow)"/>
<path d="M430 110 L 460 110" fill="none" stroke="#888780" stroke-width="0.5" marker-end="url(#arrow)"/>
<path d="M460 145 L 220 145" fill="none" stroke="#888780" stroke-width="0.5" stroke-dasharray="3,3" marker-end="url(#arrow)"/>

<text x="232" y="80" class="ts">aggregate</text>
<text x="442" y="80" class="ts">aggregate</text>
<text x="290" y="170" class="ts">prime next run</text>

<rect x="40" y="210" width="180" height="48" rx="6" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="56" y="232" class="ts">One feature's outcome:</text>
<text x="56" y="248" class="ts">"validator rejected camelCase"</text>

<rect x="250" y="210" width="180" height="48" rx="6" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="266" y="232" class="ts">Project pattern:</text>
<text x="266" y="248" class="ts">"this repo uses snake_case"</text>

<rect x="460" y="210" width="180" height="48" rx="6" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="476" y="232" class="ts">Global heuristic:</text>
<text x="476" y="248" class="ts">"check casing convention first"</text>
</svg>
