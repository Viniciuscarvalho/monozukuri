<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>monozukuri — dashboard</title>
<link rel="stylesheet" href="tokens.css">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: var(--font-mono); background: var(--surface-base); color: var(--text-primary); font-size: 13px; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

  /* ── Header ── */
  #header { display: flex; align-items: center; gap: 16px; padding: 10px 16px; background: var(--surface-raised); border-bottom: 1px solid var(--border); flex-shrink: 0; }
  #header h1 { font-size: 14px; font-weight: 600; color: var(--text-primary); letter-spacing: 0.05em; }
  #status-pill { font-size: 11px; padding: 2px 8px; border-radius: 9999px; background: var(--border); color: var(--text-secondary); }
  #status-pill.live { background: var(--success-dim); color: var(--success); }
  #run-label { font-size: 11px; color: var(--text-dim); margin-left: auto; }

  /* ── Layout ── */
  #main { display: flex; flex: 1; overflow: hidden; }
  #left-panel { width: 320px; display: flex; flex-direction: column; border-right: 1px solid var(--border-subtle); flex-shrink: 0; }
  #right-panel { flex: 1; display: flex; flex-direction: column; overflow: hidden; }

  /* ── DAG ── */
  #dag-section { padding: 12px; border-bottom: 1px solid var(--border-subtle); }
  #dag-section h2 { font-size: 11px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 8px; }
  #dag-container { height: 90px; background: var(--surface-base); border-radius: var(--radius-md); border: 1px solid var(--border-subtle); }
  .dag-unavailable { padding: 8px; color: var(--text-dim); font-size: 11px; }

  /* ── Feature list ── */
  #feature-list-section { flex: 1; overflow-y: auto; padding: 8px; }
  #feature-list-section h2 { font-size: 11px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 6px; }
  .feat-item { padding: 6px 8px; border-radius: var(--radius-sm); cursor: pointer; border: 1px solid transparent; margin-bottom: 3px; }
  .feat-item:hover { background: var(--surface-raised); border-color: var(--border); }
  .feat-item.selected { background: #1e3a5f; border-color: var(--info); }
  .feat-item .feat-id { color: var(--info); font-size: 12px; }
  .feat-item .feat-status { font-size: 10px; color: var(--text-dim); margin-top: 2px; }
  .feat-item.done .feat-status { color: var(--success); }
  .feat-item.failed .feat-status { color: var(--danger); }
  .feat-item.paused .feat-status { color: var(--warning); }
  .feat-item.retrying .feat-status { color: var(--accent); }

  /* ── Timeline ── */
  #timeline-section { flex: 1; overflow-y: auto; padding: 12px; }
  #timeline-section h2 { font-size: 11px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 8px; }
  .tl-header { display: flex; font-size: 10px; color: var(--text-dim); margin-bottom: 4px; }
  .tl-label { width: 160px; flex-shrink: 0; }
  .tl-bar-area { flex: 1; }
  .tl-row { display: flex; align-items: center; margin-bottom: 6px; }
  .tl-row.tl-row-done .tl-track { opacity: 0.7; }
  .tl-row.tl-row-failed .tl-track { border-color: var(--danger-dim); }
  .tl-feat-label { width: 160px; flex-shrink: 0; font-size: 11px; color: var(--text-secondary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding-right: 8px; }
  .tl-track { flex: 1; height: 24px; background: var(--surface-base); border: 1px solid var(--border-subtle); border-radius: var(--radius-sm); position: relative; overflow: hidden; }
  .tl-phase { position: absolute; top: 2px; bottom: 2px; min-width: 2px; border-radius: 2px; opacity: 0.85; transition: width 0.3s; }
  .tl-phase.tl-phase-failed { opacity: 0.5; }
  .tl-dot { position: absolute; top: 50%; transform: translateY(-50%); width: 5px; height: 5px; border-radius: 50%; }
  .tl-file { position: absolute; top: 50%; transform: translateY(-50%); width: 2px; height: 12px; border-radius: 1px; }

  /* ── Event log ── */
  #log-section { display: flex; flex-direction: column; border-top: 1px solid var(--border); flex-shrink: 0; }
  #log-section.collapsed { height: 32px; overflow: hidden; }
  #log-section.expanded { height: 320px; }
  #log-header { display: flex; align-items: center; gap: 8px; padding: 6px 12px; cursor: pointer; border-bottom: 1px solid var(--border-subtle); flex-shrink: 0; user-select: none; }
  #log-header h2 { font-size: 11px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.08em; flex: 1; margin: 0; }
  #log-header .log-toggle { font-size: 10px; color: var(--text-dim); }
  #log-toolbar { display: flex; gap: 8px; padding: 4px 12px; border-bottom: 1px solid var(--border-subtle); flex-shrink: 0; background: var(--surface-raised); }
  #log-search { flex: 1; background: var(--surface-base); border: 1px solid var(--border); border-radius: var(--radius-sm); color: var(--text-secondary); font-family: var(--font-mono); font-size: 11px; padding: 3px 8px; outline: none; }
  #log-search:focus { border-color: var(--brand); }
  #log-copy { background: none; border: 1px solid var(--border); border-radius: var(--radius-sm); color: var(--text-dim); font-size: 10px; padding: 2px 8px; cursor: pointer; }
  #log-copy:hover { border-color: var(--brand); color: var(--text-brand); }
  #log-count { font-size: 10px; color: var(--text-dim); align-self: center; }
  #log-entries-wrap { flex: 1; overflow-y: auto; padding: 4px 12px; font-size: 11px; font-family: var(--font-mono); }
  .log-entry { display: flex; gap: 8px; padding: 1px 0; }
  .log-ts { color: var(--text-dim); flex-shrink: 0; }
  .log-type { color: var(--accent); flex-shrink: 0; width: 160px; }
  .log-detail { color: var(--text-secondary); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .log-entry.phase-ev .log-type { color: var(--info); }
  .log-entry.tool-ev .log-type { color: var(--warning); }
  .log-entry.file-ev .log-type { color: var(--success); }
  .log-entry.feat-ev .log-type { color: var(--accent); }
  .log-entry.schema-ev .log-type { color: var(--warning); }

  /* ── Safeguard panel ── */
  #safeguard-panel { display: none; padding: 10px 12px; border-top: 1px solid var(--border-subtle); background: var(--surface-base); font-size: 11px; }
  #safeguard-panel.visible { display: block; }
  #safeguard-panel h3 { font-size: 10px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 6px; }
  .sg-row { display: flex; gap: 8px; padding: 2px 0; }
  .sg-ts { color: var(--text-dim); flex-shrink: 0; }
  .sg-type { color: var(--warning); flex-shrink: 0; width: 180px; }
  .sg-detail { color: var(--text-secondary); }
  .sg-recovery { margin-top: 6px; padding: 6px 8px; background: var(--surface-raised); border: 1px solid var(--warning-dim); border-radius: var(--radius-sm); color: var(--warning); font-size: 11px; }
</style>
</head>
<body>
<div id="header">
  <h1>monozukuri</h1>
  <span id="status-pill">connecting…</span>
  <span id="run-label">—</span>
</div>

<div id="main">
  <div id="left-panel">
    <div id="dag-section">
      <h2>Workflow</h2>
      <div id="dag-container"></div>
    </div>
    <div id="feature-list-section">
      <h2>Features</h2>
      <div id="feature-list"></div>
    </div>
  </div>

  <div id="right-panel">
    <div id="timeline-section">
      <h2>Execution timeline</h2>
      <div id="timeline-container"></div>
    </div>
    <div id="log-section" class="expanded">
      <div id="log-header">
        <h2>Event log</h2>
        <span id="log-count">0 events</span>
        <span class="log-toggle">▼</span>
      </div>
      <div id="log-toolbar">
        <input id="log-search" type="text" placeholder="Filter events…" spellcheck="false">
        <button id="log-copy">Copy</button>
      </div>
      <div id="log-entries-wrap">
        <div id="log-entries"></div>
      </div>
    </div>
    <div id="safeguard-panel">
      <h3>Safeguard history — <span id="sg-feat-id"></span></h3>
      <div id="sg-entries"></div>
      <div id="sg-recovery" class="sg-recovery" style="display:none"></div>
    </div>
  </div>
</div>

<script src="vendor/cytoscape.min.js"></script>
<script src="dag.js"></script>
<script src="timeline.js"></script>
<script>
'use strict';

const statusPill = document.getElementById('status-pill');
const runLabel = document.getElementById('run-label');
const featureList = document.getElementById('feature-list');
const logEntries = document.getElementById('log-entries');
const dagContainer = document.getElementById('dag-container');
const timelineContainer = document.getElementById('timeline-container');

const dag = new DAG(dagContainer);
const timeline = new Timeline(timelineContainer);

const features = {};
const safeguardHistory = {};  // feat_id → [{ts, type, detail}]
let selectedFeatId = null;
let filterText = '';

function formatTs(ts) {
  return ts ? new Date(ts).toLocaleTimeString('en-US', { hour12: false }) : '?';
}

function schemaEventDetail(ev) {
  if (ev.type === 'schema.reprompt.started')
    return `${ev.artifact_type} — attempt ${ev.attempt}/${ev.max}`;
  if (ev.type === 'schema.reprompt.succeeded')
    return `${ev.artifact_type} fixed on attempt ${ev.attempt}`;
  if (ev.type === 'schema.reprompt.exhausted')
    return `${ev.artifact_type} — ${ev.escalated == 1 ? 'escalated → paused' : 'exhausted (no escalation)'}`;
  if (ev.type === 'schema.validation.failed')
    return `${ev.artifact_type}: ${ev.error_signature || ''}`;
  return '';
}

function recordSafeguardEntry(featId, ev) {
  if (!featId) return;
  if (!safeguardHistory[featId]) safeguardHistory[featId] = [];
  safeguardHistory[featId].push({ ts: ev.ts, type: ev.type, detail: schemaEventDetail(ev) || ev.reason || '' });
  if (selectedFeatId === featId) renderSafeguardPanel(featId);
}

function logEvent(ev) {
  const entry = document.createElement('div');
  const typeClass = ev.type.startsWith('phase') ? 'phase-ev'
    : ev.type.startsWith('tool') ? 'tool-ev'
    : ev.type.startsWith('file') ? 'file-ev'
    : ev.type.startsWith('schema') ? 'schema-ev'
    : ev.type.startsWith('feature') ? 'feat-ev'
    : '';
  entry.className = `log-entry ${typeClass}`;
  const detail = ev.type.startsWith('schema') ? schemaEventDetail(ev)
    : ev.tool || ev.path || ev.phase || ev.reason || ev.text || '';
  const rawText = `${formatTs(ev.ts)} ${ev.type} ${ev.feature_id || ''} ${detail}`;
  entry.dataset.raw = rawText;
  entry.innerHTML = `<span class="log-ts">${formatTs(ev.ts)}</span><span class="log-type">${ev.type}</span><span class="log-detail">${ev.feature_id ? ev.feature_id + ' ' : ''}${detail}</span>`;
  if (filterText && !rawText.toLowerCase().includes(filterText)) entry.style.display = 'none';
  logEntries.appendChild(entry);
  if (logEntries.children.length > 500) logEntries.firstChild.remove();
  document.dispatchEvent(new CustomEvent('mz:logevent', { detail: ev }));
}

function renderSafeguardPanel(featId) {
  const panel = document.getElementById('safeguard-panel');
  const sgFeatId = document.getElementById('sg-feat-id');
  const sgEntries = document.getElementById('sg-entries');
  const sgRecovery = document.getElementById('sg-recovery');
  if (!featId) { panel.classList.remove('visible'); return; }
  panel.classList.add('visible');
  sgFeatId.textContent = featId;
  sgEntries.innerHTML = '';
  const history = safeguardHistory[featId] || [];
  for (const entry of history) {
    const row = document.createElement('div');
    row.className = 'sg-row';
    row.innerHTML = `<span class="sg-ts">${formatTs(entry.ts)}</span><span class="sg-type">${entry.type}</span><span class="sg-detail">${entry.detail}</span>`;
    sgEntries.appendChild(row);
  }
  const el = features[featId];
  const isPaused = el && el.classList.contains('paused');
  if (isPaused) {
    sgRecovery.style.display = 'block';
    sgRecovery.textContent = `↻ Recoverable — run: monozukuri retry --feat ${featId}`;
  } else {
    sgRecovery.style.display = 'none';
  }
}

function updateFeatureList(featId, status) {
  let el = features[featId];
  if (!el) {
    el = document.createElement('div');
    el.className = 'feat-item';
    el.innerHTML = `<div class="feat-id">${featId}</div><div class="feat-status">queued</div>`;
    el.addEventListener('click', () => {
      document.querySelectorAll('.feat-item').forEach(e => e.classList.remove('selected'));
      el.classList.add('selected');
      selectedFeatId = featId;
      renderSafeguardPanel(featId);
    });
    featureList.appendChild(el);
    features[featId] = el;
  }
  el.querySelector('.feat-status').textContent = status;
  el.classList.remove('done', 'failed', 'paused', 'retrying', 'active');
  if (status === 'done' || status === 'pr-created') el.classList.add('done');
  else if (status === 'failed') el.classList.add('failed');
  else if (status === 'paused') el.classList.add('paused');
  else if (status === 'retrying') el.classList.add('retrying');
  if (selectedFeatId === featId) renderSafeguardPanel(featId);
}

function handleEvent(ev) {
  dag.handle(ev);
  if (ev.feature_id && ['tool.invoked', 'tool.completed', 'file.touched', 'phase.started', 'phase.completed', 'phase.failed', 'feature.completed', 'feature.failed', 'feature.paused'].includes(ev.type)) {
    timeline.handle(ev);
  }
  logEvent(ev);

  // Safeguard history (schema events + paused/retry events)
  if (ev.feature_id && (ev.type.startsWith('schema.') || ev.type === 'feature.paused' || ev.type.startsWith('feature.retry'))) {
    recordSafeguardEntry(ev.feature_id, ev);
  }

  // Feature list updates
  if (ev.type === 'feature.queued') updateFeatureList(ev.feature_id, 'queued');
  if (ev.type === 'feature.started') updateFeatureList(ev.feature_id, 'running');
  if (ev.type === 'feature.completed') updateFeatureList(ev.feature_id, 'done');
  if (ev.type === 'feature.failed') updateFeatureList(ev.feature_id, 'failed');
  if (ev.type === 'feature.paused') updateFeatureList(ev.feature_id, 'paused');
  if (ev.type === 'feature.skipped') updateFeatureList(ev.feature_id, 'skipped');
  if (ev.type === 'feature.deferred') updateFeatureList(ev.feature_id, 'deferred');
  if (ev.type === 'feature.retry_started') updateFeatureList(ev.feature_id, 'retrying');
  if (ev.type === 'feature.retry_completed') {
    const newStatus = ev.new_status || (ev.exit_code == 0 ? 'done' : 'paused');
    updateFeatureList(ev.feature_id, newStatus);
  }
}

// Fetch run ID
fetch('/run-id').then(r => r.json()).then(({ runId }) => {
  runLabel.textContent = `run: ${runId.slice(0, 8)}…`;
}).catch(() => {});

// Log panel interactivity
(function() {
  const logSection = document.getElementById('log-section');
  const logHeader = document.getElementById('log-header');
  const logToggle = logHeader.querySelector('.log-toggle');
  const logSearch = document.getElementById('log-search');
  const logCopy = document.getElementById('log-copy');
  const logCount = document.getElementById('log-count');
  const logEntriesWrap = document.getElementById('log-entries-wrap');
  let totalEvents = 0;

  logHeader.addEventListener('click', () => {
    if (logSection.classList.contains('expanded')) {
      logSection.classList.replace('expanded', 'collapsed');
      logToggle.textContent = '▶';
    } else {
      logSection.classList.replace('collapsed', 'expanded');
      logToggle.textContent = '▼';
    }
  });

  // Prevent toggle when clicking toolbar (search/copy)
  document.getElementById('log-toolbar').addEventListener('click', e => e.stopPropagation());

  logSearch.addEventListener('input', () => {
    filterText = logSearch.value.toLowerCase();
    document.querySelectorAll('#log-entries .log-entry').forEach(el => {
      el.style.display = el.dataset.raw && el.dataset.raw.toLowerCase().includes(filterText) ? '' : 'none';
    });
  });

  logCopy.addEventListener('click', () => {
    const visible = [...document.querySelectorAll('#log-entries .log-entry')]
      .filter(el => el.style.display !== 'none')
      .map(el => el.dataset.raw || '')
      .join('\n');
    navigator.clipboard.writeText(visible).then(() => {
      logCopy.textContent = 'Copied!';
      setTimeout(() => { logCopy.textContent = 'Copy'; }, 1500);
    });
  });

  document.addEventListener('mz:logevent', (e) => {
    const ev = e.detail;
    totalEvents++;
    logCount.textContent = totalEvents + ' events';
    if (logEntriesWrap.scrollHeight - logEntriesWrap.scrollTop - logEntriesWrap.clientHeight < 60) {
      setTimeout(() => { logEntriesWrap.scrollTop = logEntriesWrap.scrollHeight; }, 0);
    }
  });
})();

// Connect to SSE
function connect() {
  const es = new EventSource('/events');
  es.onopen = () => {
    statusPill.textContent = 'live';
    statusPill.classList.add('live');
  };
  es.onerror = () => {
    statusPill.textContent = 'reconnecting…';
    statusPill.classList.remove('live');
    es.close();
    setTimeout(connect, 3000);
  };
  es.onmessage = (msg) => {
    try {
      const ev = JSON.parse(msg.data);
      handleEvent(ev);
    } catch (_) {}
  };
}

connect();
</script>
</body>
</html>
